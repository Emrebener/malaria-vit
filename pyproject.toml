[project]
name = "malaria-vit"
version = "0.1.0"
description = "Vision Transformer malaria cell classification"
authors = [
    { name = "emrebener", email = "emre.bener@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fvcore>=0.1.5.post20221221",
    "lightning>=2.6.5",
    "matplotlib>=3.11.0",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "scikit-learn>=1.9.0",
    "timm>=1.0.27",
    "torch>=2.6.0",
    "torchmetrics>=1.0.3",
    "torchvision>=0.21.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
